<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店铺配置</title>
<style>:root {
  color-scheme:light;
  font-family:Inter,"Microsoft YaHei","PingFang SC",sans-serif;
  color:#24334b;
  background:#f3f5f9;
  font-size:14px
}
* {
  box-sizing:border-box
}
body {
  margin:0
}
button,input,select {
  font:inherit
}
button {
  cursor:pointer;
  border:0;
  background:none;
  color:inherit
}
input,select {
  width:100%;
  min-width:0;
  height:38px;
  border:1px solid #dce2ec;
  border-radius:6px;
  background:#fff;
  padding:0 10px;
  color:#24334b
}
input:focus,select:focus {
  border-color:#336cff;
  outline:3px solid #336cff14
}
button:focus-visible,a:focus-visible {
  outline:3px solid #336cff80;
  outline-offset:3px
}
button:disabled {
  cursor:not-allowed;
  opacity:.4
}
[hidden] {
  display:none!important
}
h1,h2,h3,p {
  margin:0
}
h1 {
  font-size:24px;
  letter-spacing:.5px
}
h2 {
  font-size:17px
}
h3 {
  font-size:14px
}
small,.secondary {
  font-size:12px;
  color:#7b879b;
  line-height:1.7
}
.text-button {
  color:#2c65ee;
  padding:5px 0;
  font-size:13px;
  white-space:nowrap
}
.text-button:hover {
  color:#1849c2;
  text-decoration:underline
}
.primary-button,.secondary-button,.outlined {
  padding:9px 17px;
  border-radius:6px;
  white-space:nowrap;
  font-weight:500;
  font-size:13px;
  min-height:38px
}
.primary-button {
  background:#2e65f3;
  color:#fff;
  box-shadow:0 3px 8px #2e65f318
}
.primary-button:hover {
  background:#2457db
}
.secondary-button {
  border:1px solid #dce2ec;
  background:#fff
}
.secondary-button:hover {
  background:#f7f9fc
}
.outlined {
  color:#2e65f3;
  border:1px solid #cbd9fd;
  background:#fff
}
.danger {
  color:#d34949
}
.required {
  color:#d34949
}

/* Preserve the existing administration shell; new workflows live inside drawers. */
.toast[data-tone="error"] {border-color:#f2c7c2;background:#fff7f6;color:#c04b40;}
.product-shell{min-height:100vh;background:linear-gradient(135deg,#edf3ff,#f5f8fe 70%,#e8f0ff)}
.topbar{height:64px;display:flex;align-items:center;padding:0 20px;gap:28px;background:linear-gradient(180deg,#cfdef8,#eaf3ff 90%);color:#33445e}
.brand-logo{width:208px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.logo{width:38px;height:38px;display:grid;place-items:center;background:linear-gradient(135deg,#38b0ff,#3867f5);border-radius:5px;color:#fff;font-size:32px;line-height:1}
.brand-logo strong{font-size:18px;color:#222;font-weight:700}
.topbar nav{height:100%;display:flex;align-items:center;gap:38px;white-space:nowrap;font-size:14px}
.topbar nav span{height:100%;display:flex;align-items:center;position:relative}
.topbar nav .active{color:#276bff}
.topbar nav .active:after{content:"";position:absolute;bottom:10px;left:2px;width:22px;height:3px;background:#276bff;border-radius:2px}
.account{margin-left:auto;display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:13px}
.account-avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#c5d7e8;color:#54748c;font-size:12px}
.workspace{display:flex;min-height:calc(100vh - 64px)}
aside{width:168px;flex-shrink:0;padding:0 20px 20px 10px;color:#334f79;font-size:14px}
aside>div{padding:12px 10px 12px 37px;white-space:nowrap}
aside .menu-title{padding:13px 12px 13px 20px;display:flex;align-items:center;gap:5px}
.menu-arrow{margin-left:auto;font-size:12px}
.menu-selected{background:#cfdfff;border-radius:8px;color:#276bff}
main{flex:1;min-width:0;padding:0 18px 20px 0}
.page-title{height:58px;display:flex;align-items:center;background:#fff;border-radius:9px;margin-bottom:10px;padding:0 20px}
.page-title h1{font-size:16px;font-weight:600;letter-spacing:0;color:#111}
.list-panel{background:#fff;border-radius:9px;padding:40px 20px 20px;min-height:calc(100vh - 132px)}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.filters label{display:flex;align-items:center;height:34px;border:1px solid #e2e2e2;border-radius:4px;min-width:0;padding-left:10px;font-size:14px;color:#888}
.filters label>span{white-space:nowrap;flex-shrink:0}
.filters input,.filters select{height:32px;border:0;min-height:0;background:transparent;font-size:14px;padding:0 12px;border-radius:4px;box-shadow:none}
.filters input::placeholder,.filters select.placeholder{color:#a8acb8}
.filters label:focus-within{border-color:#5590ff;box-shadow:0 0 0 2px #276bff0d}
.filters input:focus,.filters select:focus{outline:none}
.filters option{color:#24334b}
.toolbar{display:flex;align-items:center;gap:16px;margin:16px 0}
.toolbar .outlined{border:1px solid #276bff;color:#276bff;padding:5px 15px;min-height:33px;height:33px;border-radius:3px;font-weight:400;font-size:14px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
th{font-size:13px;font-weight:400;background:#f5f6fa;color:#111;padding:11px 8px;white-space:nowrap;border-bottom:1px solid #e7edf7}
td{padding:10px 8px;border-bottom:1px solid #e7edf7;vertical-align:middle}
.shop-table{min-width:1080px;border:1px solid #e7edf7;table-layout:fixed}
.shop-table th:first-child{width:27%}.shop-table th:nth-child(2){width:10%}.shop-table th:nth-child(3){width:12%}.shop-table th:nth-child(4){width:25%}.shop-table th:nth-child(5){width:16%}.shop-table th:last-child{width:10%}
.shop-table th:not(:first-child),.shop-table td:not(:first-child){text-align:center}
.shop-table td{height:63px}
.shop-table tbody tr:hover{background:#fbfdff}
.shop-identity{display:flex;gap:8px;align-items:center}
.brand-mark{height:40px;width:40px;flex-shrink:0;display:grid;place-items:center;border-radius:4px;background:#258cc6;color:#fff;font-size:10px;font-weight:600}
.brand-mark[data-brand="美的"]{background:#0878be}.brand-mark[data-brand="苏泊尔"]{background:#e87531}.brand-mark[data-brand="康佳"]{background:#176ab5}
.shop-name{font-weight:600;color:#161616;font-size:13px}
.shop-id{font-size:11px;color:#91a0b4;margin-top:5px}
.next-person{font-size:11px;color:#8393aa;margin-top:5px;white-space:nowrap}
.actions{display:flex;gap:12px;justify-content:center}
.shop-table .text-button{font-size:12px;color:#276bff}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap;background:#f1f4f8;color:#7d8aa0}
.badge.green{background:#eaf7f1;color:#288765}.badge.blue{background:#edf3ff;color:#376deb}.badge.type{color:#5f6f87;background:#f1f4f9}
.list-footer{display:flex;justify-content:space-between;padding-top:18px;color:#8a96a8;font-size:12px}
.empty{text-align:center;padding:32px 16px;color:#8a96a8;font-size:13px}.empty strong{display:block;color:#52627b;font-size:14px;margin-bottom:7px;font-weight:500}
.toast{position:fixed;z-index:30;top:25px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #cfe8db;color:#287855;border-radius:7px;padding:13px 22px;box-shadow:0 8px 30px #24334b22;max-width:90vw;font-size:13px}
@media(max-width:1650px){.topbar{gap:16px}.brand-logo{width:180px}.topbar nav{gap:24px;font-size:13px}.account{font-size:12px}.filters{gap:14px}.filters input,.filters select,.filters label{font-size:12px}}
@media(max-width:1350px){.brand-logo{width:150px}.topbar nav{gap:18px}.topbar nav span:nth-child(5),.topbar nav span:nth-child(11){display:none}.account-avatar{display:none}}
@media(max-width:1100px){.topbar nav{gap:16px}.topbar nav span:nth-child(7),.topbar nav span:nth-child(8),.topbar nav span:nth-child(9){display:none}.account{gap:4px}.filters{grid-template-columns:1fr 1fr}.list-panel{padding-top:24px}}
@media(max-width:780px){.topbar{padding:0 16px;height:60px}.topbar nav,aside{display:none}.brand-logo{width:auto}.account{font-size:11px}.workspace{min-height:calc(100vh - 60px)}main{padding:0 10px 16px}.page-title{height:54px;padding:0 16px}.list-panel{padding:20px 14px;min-height:calc(100vh - 124px)}.filters{gap:10px}.filters label{padding-left:8px}.filters input,.filters select{padding:0 6px}.shop-table{min-width:1080px}}
@media(max-width:420px){.filters{grid-template-columns:1fr}.account{font-size:10px}.brand-logo strong{font-size:16px}}

#modified-sort{padding:0;font:inherit;color:inherit;white-space:nowrap;}
#modified-sort:after{content:'↓';margin-left:5px;color:#276bff;}
#modified-sort[data-direction="asc"]:after{content:'↑';}
.modified-time{white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums;color:#697a91;}

.shop-pagination{display:flex;align-items:center;justify-content:flex-end;gap:20px;padding:20px 0 4px;font-size:12px;flex-wrap:wrap;}
.shop-pagination #total-count{white-space:nowrap;}
.shop-pagination select{width:96px;height:32px;min-height:32px;background:#f7f9fc;border-color:transparent;font-size:12px;}
.page-controls,.page-numbers{display:flex;align-items:center;gap:8px;}
.page-controls{margin-left:0;}
.page-controls button{width:32px;height:32px;border-radius:50%;background:transparent;color:#34445d;}
.page-controls button:hover{background:#edf3ff;color:#2e65f3;}
.page-controls button[aria-current="page"]{background:#2e65f3;color:#fff;}
.page-controls>button{background:#f1f6ff;color:#2e65f3;}
.page-controls button:disabled{opacity:.35;cursor:not-allowed;}
.page-jump{display:flex;align-items:center;gap:10px;margin-left:20px;}
.page-jump input{width:48px;height:32px;min-height:32px;text-align:center;border-color:#edf0f5;padding:0 4px;appearance:textfield;}
.page-jump input::-webkit-inner-spin-button{appearance:none;}
@media(max-width:600px){.shop-pagination{gap:12px;justify-content:space-between;}.shop-pagination #total-count{margin-right:0;}.page-jump{margin-left:0;}}

.record-pagination{justify-content:flex-end;}
.record-pagination .page-controls{margin-left:0;}
.record-pagination .page-jump{margin-left:0;}
.overlay {
  position:fixed;
  inset:0;
  background:#1b2d4c55;
  z-index:10;
  display:flex;
  align-items:stretch;
  justify-content:flex-end;
  padding:0
}
.editor {
  width:800px;
  max-width:100%;
  height:100dvh;
  max-height:100dvh;
  border-radius:0;
  background:#fff;
  box-shadow:-12px 0 48px #172a4b24;
  display:flex;
  flex-direction:column;
  overflow:hidden
}
.dialog-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:21px 26px;
  border-bottom:1px solid #e9edf4;
  flex-shrink:0
}
.close {
  border-radius:50%;
  width:30px;
  height:30px;
  font-size:24px;
  line-height:1;
  background:#f5f7fa;
  color:#8190a5
}
.close:hover {
  background:#eaf0fa
}
.dialog-content {
  padding:24px 26px;
  overflow:auto;
  overscroll-behavior:contain
}
.shop-summary {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px
}
.shop-summary strong {
  font-size:14px
}
.shop-avatar {
  background:#edf3ff;
  color:#3b6dea;
  width:40px;
  height:40px;
  border-radius:9px;
  display:grid;
  place-items:center
}
.current-card {
  border:1px solid #dce7fc;
  border-radius:8px;
  padding:18px 20px;
  margin-bottom:24px;
  background:linear-gradient(115deg,#f2f6ff,#fbfcff)
}
.card-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px
}
.eyebrow {
  font-size:12px;
  color:#7386a7
}
.current-person {
  font-size:21px;
  font-weight:600;
  letter-spacing:.2px
}
.current-person span {
  font-size:14px;
  font-weight:400;
  color:#617693;
  margin-left:10px
}
.current-until {
  font-size:12px;
  color:#8290a6;
  margin:6px 0 14px
}
.config-meta {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  color:#7a8ba4;
  margin-top:14px
}
.schedule-table {
  margin-top:12px;
  border-top:1px solid #dfe7f5
}
.schedule-table td {
  font-size:12px;
  padding:10px 0;
  border-color:#e4ebf7
}
.schedule-table td:last-child {
  text-align:right
}
.schedule-table tr:last-child td {
  border-bottom:0
}
.schedule-table .current-row td {
  color:#2f65e5
}
.section-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px
}
.count {
  color:#8795aa;
  font-size:12px;
  font-weight:400;
  margin-left:5px
}
.pending-card {
  border:1px solid #e2e8f1;
  border-radius:8px;
  padding:16px 18px;
  margin-bottom:12px
}
.pending-card .card-heading {
  margin-bottom:8px
}
.pending-card .card-heading strong {
  font-weight:500;
  font-size:14px
}
.pending-bottom {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #edf0f5
}
.pending-bottom .actions {
  gap:18px
}
.pending-owner {
  font-size:14px;
  color:#435572
}
.pending-empty {
  background:#f8fafc;
  border:1px dashed #e1e7f0;
  border-radius:7px;
  padding:25px;
  text-align:center;
  color:#8a97aa;
  font-size:12px
}
.pending-empty strong {
  display:block;
  color:#52627b;
  font-size:13px;
  font-weight:500;
  margin-bottom:6px
}
.overview-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:23px;
  gap:12px
}
.form-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px
}
.form-basics {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  margin-bottom:20px
}
.field {
  font-size:12px;
  display:block;
  color:#4b5c74
}
.field>input,.field>select {
  display:block;
  margin-top:9px
}
.field small {
  display:block;
  margin-top:6px;
  font-size:11px
}
.two-col {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-bottom:24px
}
.mode-field {
  border:0;
  margin:0;
  padding:0;
  min-width:0
}
.mode-field legend {
  font-size:12px;
  color:#4b5c74;
  margin-bottom:9px
}
.mode-options {
  display:flex;
  border:1px solid #dce2ec;
  border-radius:6px;
  height:38px;
  overflow:hidden
}
.mode-options label {
  flex:1;
  position:relative;
  display:grid;
  place-items:center;
  font-size:13px;
  cursor:pointer
}
.mode-options input {
  position:absolute;
  opacity:0;
  width:1px;
  height:1px
}
.mode-options span {
  height:100%;
  width:100%;
  display:grid;
  place-items:center
}
.mode-options input:checked+span {
  background:#edf3ff;
  color:#2e65f3;
  box-shadow:inset 0 0 0 1px #7da4ff
}
.mode-options input:focus-visible+span {
  outline:2px solid #336cff;
  outline-offset:-3px
}
.segment {
  border:1px solid #e3e9f2;
  border-radius:8px;
  padding:14px 16px;
  margin-bottom:12px;
  background:#fff
}
.segment-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:12px;
  font-weight:500
}
.segment-header button {
  font-size:12px
}
.segment-dates {
  display:grid;
  grid-template-columns:1fr 28px 1fr;
  gap:8px;
  align-items:center;
  margin-bottom:14px
}
.date-endpoints {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
.segment-dates>.separator {
  text-align:center;
  color:#95a2b6
}
.date-caption {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:#8b97aa;
  margin-bottom:5px
}
.cross-tag {
  background:#fff5e6;
  color:#b7893b;
  border-radius:3px;
  padding:1px 5px;
  font-size:10px
}
.segment .two-col {
  margin-bottom:0;
  gap:18px
}
.segment select {
  font-size:12px;
  height:35px
}
.coverage-note {
  font-size:12px;
  color:#a77c36;
  margin:4px 0 20px
}
.coverage-note.ok {
  color:#2d926e
}
.error {
  background:#fff3f2;
  border:1px solid #ffdcd7;
  color:#c24d43;
  padding:12px 14px;
  font-size:12px;
  border-radius:6px;
  margin-top:14px;
  line-height:1.7
}
.form-actions {
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding-top:20px;
  margin-top:20px;
  border-top:1px solid #edf0f5
}
.records {
  width:1280px
}
.record-filters {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  align-items:end;
  margin-bottom:20px
}
.record-table {min-width:1120px;table-layout:fixed;}
.record-table th:first-child {width:16%;}
.record-table th:nth-child(2) {width:6%;}
.record-table th:nth-child(3),.record-table th:nth-child(4) {width:26%;}
.record-table th:nth-child(5) {width:11%;}
.record-table th:last-child {width:15%;}
.record-table td {vertical-align:top;}
.record-config-heading {display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 10px;margin-bottom:6px;line-height:1.7;}
.record-config-heading>strong {font-size:12px;font-weight:500;}
.record-origin-date {font-size:11px;color:#77869b;white-space:nowrap;}
.record-period {display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-top:4px;line-height:1.7;}
.record-period strong {font-weight:500;color:#24334b;}
.record-period span {flex:0 0 110px;color:#77869b;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.record-action {display:inline-block;margin:0;padding:1px 6px;border-radius:3px;background:#f1f5fb;color:#71839e;font-size:11px;line-height:1.6;}
.record-change-time {white-space:nowrap;font-variant-numeric:tabular-nums}
.record-table td {
  font-size:12px
}
.record-filters label[hidden]+label {
  grid-column:auto
}
.confirm-overlay {
  z-index:20;
  background:#1b2d4c44;
  align-items:center;
  justify-content:center;
  padding:20px
}
.confirm-box {
  width:420px;
  max-width:100%;
  background:#fff;
  border-radius:12px;
  padding:25px;
  box-shadow:0 16px 60px #172a4b33
}
.confirm-box p {
  font-size:13px;
  line-height:1.9;
  color:#6a7a91;
  margin-top:14px;
  white-space:pre-line
}
.confirm-box .form-actions {
  margin-top:18px;
  padding-top:18px
}

.segment {
  display:grid;
  grid-template-columns:1.35fr 1fr;
  column-gap:16px
}
.segment-header {
  grid-column:1/-1;
  margin-bottom:8px
}
.segment-dates {
  margin-bottom:0;
  gap:4px;
  grid-template-columns:1fr 16px 1fr
}
.date-endpoints {
  gap:5px
}
.segment .two-col {
  gap:10px;
  align-items:end
}
.segment .field>select {
  margin-top:5px
}
.segment .field {
  font-size:11px;
  color:#8b97aa
}
.segment select {
  padding:0 5px
}

@media(max-width:780px) {
  .overlay {
  padding:14px
}
.editor {
  max-height:calc(100dvh - 28px)
}
.dialog-head {
  padding:17px 18px
}
.dialog-content {
  padding:18px
}
.records .record-filters {
  grid-template-columns:1fr 1fr
}
.record-filters>button {
  justify-self:start
}
.form-basics {
  gap:14px
}
.segment {
  padding:12px;
  display:block
}
.segment-dates {
  margin-bottom:12px
}
.date-endpoints {
  gap:4px
}
.segment select {
  padding:0 5px
}
.overview-bottom {
  align-items:flex-start;
  flex-direction:column;
  gap:4px
}

}
@media(max-width:420px) {
  .overlay {

.current-context {display:flex;align-items:center;gap:12px;padding:12px 14px;background:#f6f8fc;border-radius:6px;margin-bottom:22px;font-size:13px;}
.annual-heading {display:flex;align-items:center;gap:7px;}
.annual-help {position:relative;display:inline-flex;align-items:center;}
.annual-help>button {display:grid;place-items:center;width:15px;height:15px;padding:0;border:1px solid #a4b0c2;border-radius:50%;color:#8996aa;font-size:11px;line-height:1;}
.annual-help>button:hover,.annual-help>button:focus-visible {border-color:#2e65f3;color:#2e65f3;}
.annual-help-tip {display:none;position:absolute;left:0;top:100%;padding:10px 12px;width:min(280px,calc(100vw - 130px));border-radius:6px;background:#35445c;color:#fff;font-size:12px;font-weight:400;line-height:1.7;box-shadow:0 5px 16px #172a4b20;z-index:4;}
.annual-help:hover .annual-help-tip,.annual-help:focus-within .annual-help-tip {display:block;}
.annual-help.dismissed .annual-help-tip {display:none;}
.current-context strong {font-weight:500;}
.current-context .text-button {margin-left:auto;font-size:12px;}
/* Configuration management uses explicit row actions rather than selection controls. */
.configuration-toolbar,.configuration-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
.configuration-toolbar h3,.configuration-heading h3 {font-size:14px;margin:0;}
.configuration-toolbar h3 span {margin-left:6px;font-weight:400;}
.configuration-heading .text-button {font-size:12px;}
.configuration-table {width:100%;min-width:700px;table-layout:fixed;}
.configuration-table th:first-child{width:112px;}
.configuration-table th:nth-child(2){width:80px;}
.configuration-table th:nth-child(4){width:70px;}
.configuration-table th:last-child{width:86px;}
.configuration-table td {font-size:12px;vertical-align:top;padding:16px 8px;}
.configuration-table .actions {gap:12px;justify-content:flex-start;}
.configuration-table .text-button {font-size:12px;}
.configuration-period + .configuration-period {margin-top:12px;padding-top:12px;border-top:1px solid #edf0f5;}
.configuration-period span,.configuration-period strong {display:block;}
.configuration-period span {color:#6e7e96;font-size:11px;margin-bottom:3px;}
.configuration-period strong {font-weight:400;}

.clearable-input {position:relative;}

.cascader-column+ .cascader-column {border-left:1px solid #edf0f5;}
.cascader-heading {padding:10px 14px;color:#8895a8;font-size:11px;border-bottom:1px solid #edf0f5;}
.cascader-options {overflow-y:auto;overscroll-behavior:contain;padding:4px 0;flex:1;scrollbar-width:thin;}
.cascader-options button {width:100%;display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 14px;flex-shrink:0;font-size:12px;color:#41516a;text-align:left;}
.cascader-options button:hover,.cascader-options button:focus-visible {background:#f3f6fd;outline-offset:-2px;}

.segment .field>.person-picker{margin-top:5px;}
.segment .person-picker input{height:35px;font-size:12px;padding-left:5px;}

.person-options{position:fixed;z-index:100;max-height:200px;overflow:auto;padding:4px;background:#fff;border:1px solid #dce4f0;border-radius:6px;box-shadow:0 6px 20px #24395824;font-size:13px;}

.person-options [role="option"]:hover,.person-options [aria-selected="true"]{background:#edf3ff;color:#2e65f3;}
.person-empty{color:#8b96a8;}
#record-shop{padding-right:34px;}
.clearable-select{display:block;position:relative;width:100%;min-width:0;}
.clearable-select select{width:100%;}
.clearable-select.has-selection select{appearance:none;padding-right:32px;}
.selection-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;padding:0;line-height:24px;color:#8b96a8;border-radius:4px;font-size:17px;}
.selection-clear:hover{background:#edf3ff;color:#276bff;}
.person-picker.has-selection .person-arrow{display:none;}
.field>.clearable-select{margin-top:9px;}

<body><div id="shop-assignment">
  <div class="product-shell">
    <header class="topbar"><div class="brand-logo"><div class="logo">↗</div><strong>数智罗盘</strong></div><nav aria-label="系统导航"><span>首页</span><span>兴趣电商⌄</span><span>一类电商⌄</span><span>直播</span><span>退货</span><span>财务</span><span>广告</span><span>库存</span><span>订单</span><span>店铺⌄</span><span>弹幕</span><span>报表</span><span class="active">设置⌄</span></nav><div class="account"><span class="account-avatar" aria-hidden="true">管</span>系统租户管理员 <span>⌄</span></div></header>
    <div class="workspace"><aside><div class="menu-title"><span aria-hidden="true">▱</span> 店铺管理 <span class="menu-arrow">⌃</span></div><a class="menu-selected" href="店铺配置.html">店铺配置</a></aside>
      <main><div class="page-title"><h1>店铺配置</h1><nav class="platform-tabs" role="tablist" aria-label="店铺配置平台"><button type="button" id="tab-douyin" role="tab" data-platform="douyin" aria-controls="assignment-panel">抖音</button><button type="button" id="tab-kuaishou" role="tab" data-platform="kuaishou" aria-controls="assignment-panel">快手</button><button type="button" id="tab-wechat" role="tab" data-platform="wechat" aria-controls="assignment-panel">视频号</button><button type="button" id="tab-tmall" role="tab" data-platform="tmall" aria-controls="assignment-panel">天猫</button><button type="button" id="tab-jd" role="tab" data-platform="jd" aria-controls="assignment-panel">京东</button><button type="button" id="tab-pdd" role="tab" data-platform="pdd" aria-controls="assignment-panel">拼多多</button></nav></div>
      <section class="list-panel" id="assignment-panel" role="tabpanel" aria-labelledby="tab-douyin"><div class="filters"><label><span>店铺名称</span><input id="shop-search" placeholder="请输入店铺名称/店铺ID" type="search"></label><label><span>品牌</span><select id="brand-filter"><option value="">请选择品牌</option></select></label><label><span data-org-label>运营大区</span><select id="region-filter"><option value="">请选择运营大区</option></select></label><label><span id="owner-filter-label">运营主管</span><input id="owner-filter" placeholder="请输入运营姓名" type="search"></label><label class="ss-promotion-filter"><span>店铺推广</span><input id="promotion-filter" placeholder="请输入推广姓名" type="search"></label><label><span>店铺分类</span><select id="category-filter"></select></label><label><span>是否考核店铺</span><select id="assessed-filter"><option value="">全部</option><option value="yes">是</option><option value="no">否</option></select></label></div>
      <div class="toolbar"><button class="outlined" id="records-open">分配记录</button><button type="button" class="text-button" id="shop-filter-reset">重置</button></div>
      <div class="table-wrap"><table class="shop-table"><thead><tr><th>店铺名称</th><th>品牌</th><th data-org-label>运营大区</th><th>运营主管</th><th aria-sort="descending"><button type="button" id="modified-sort" data-direction="desc">最近修改时间</button></th><th>店铺分类</th><th>是否考核店铺</th><th>操作</th></tr></thead><tbody id="shop-rows"></tbody></table></div><nav class="shop-pagination" id="shop-pagination" aria-label="店铺列表分页"><span id="total-count" aria-live="polite"></span><select id="page-size" aria-label="每页条数"><option value="10">10条/页</option><option value="20">20条/页</option></select><div class="page-controls"><button type="button" id="page-prev" aria-label="上一页">←</button><div id="page-numbers" class="page-numbers"></div><button type="button" id="page-next" aria-label="下一页">→</button></div><label class="page-jump">前往<input type="number" id="page-jump" min="1" value="1" aria-label="跳转页码">页</label></nav></section></main>
    </div>
  </div>
  <div class="overlay" id="editor-overlay" hidden><section class="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title"><header class="dialog-head"><h2 id="editor-title">店铺负责配置</h2><button class="close" data-close aria-label="关闭">×</button></header><div class="dialog-content"><div class="shop-summary"><div class="shop-avatar">店</div><div><strong id="editor-shop"></strong><div class="secondary" id="editor-meta"></div></div></div>

    <div id="annual-fields" hidden><div class="section-title"><div><div class="annual-heading"><h3>全年负责安排</h3><span class="annual-help"><button type="button" id="annual-help" aria-label="2 月 29 日处理规则" aria-describedby="annual-help-tip">?</button><span class="annual-help-tip" id="annual-help-tip" role="tooltip">2 月 29 日：平年开始顺延至 3 月 1 日，结束按 2 月 28 日。</span></span></div><p class="secondary">配齐全年，每年按时段自动轮换</p></div><button type="button" class="text-button" id="add-segment">＋ 添加时段</button></div><div id="segments"></div><div class="coverage-note" id="coverage-note" aria-live="polite"></div></div>

// 前台与数智罗盘共用的平台分类规则；旧值只做有依据的迁移，考核属性独立保留。
window.ShopClassification=(()=>{
 const platforms=filterCatalog.platformNames;
 const rules={京东:['自营','POP旗舰店','POP专卖店'],天猫:['旗舰店','专卖店'],拼多多:['旗舰店','专卖店'],抖音:['旗舰店','专卖店'],快手:['旗舰店','专卖店'],视频号:['旗舰店','专卖店']};
 const pending='无分类',order=['旗舰店','POP旗舰店','专卖店','POP专卖店','自营',pending];
 const name=platform=>Object.hasOwn(platforms,platform)?platforms[platform]:platform;
 const allowed=platform=>Object.hasOwn(rules,name(platform))?[...rules[name(platform)]]:[];
 function options(selection='all',includePending=true){
  const selected=(Array.isArray(selection)?selection:[selection]).filter(p=>p&&p!=='all');
  const values=new Set((selected.length?selected:Object.keys(rules)).flatMap(allowed));
  return order.filter(value=>values.has(value)||(includePending&&value===pending));
 }
 function normalize(platform,category){
  const current=String(category||'').trim();
  const migrated=name(platform)==='京东'?({'自营店':'自营','旗舰店':'POP旗舰店','专卖店':'POP专卖店'}[current]||current):current;
  return allowed(platform).includes(migrated)?migrated:pending;
 }
 function infer(platform,shopName=''){
  const category=/自营/.test(shopName)?'自营店':/旗舰店/.test(shopName)?'旗舰店':/专卖店/.test(shopName)?'专卖店':null;
  return normalize(platform,category);
 }
 function resolve(platform,shop,saved){
  const source=saved&&Object.hasOwn(saved,'shopCategory')?saved:shop;
  const shopCategory=source?.shopCategory?normalize(platform,source.shopCategory):infer(platform,shop.name);
  const legacy=shopCategory===pending?(source?.legacyShopCategory||source?.shopCategory):null;
  return {shopCategory,...(legacy&&legacy!==pending&&legacy!=='待确认'?{legacyShopCategory:legacy}:{}),assessed:typeof saved?.assessed==='boolean'?saved.assessed:!!shop.assessed};
 }
 function store(data){
  const shops={};
  if(data?.version===1&&data.shops&&typeof data.shops==='object'&&!Array.isArray(data.shops))for(const [key,value] of Object.entries(data.shops)){
   const parts=key.split('|');if(parts.length!==2||!Object.hasOwn(rules,parts[0])||!parts[1]||!value||typeof value!=='object')continue;
   const row={};
   if(typeof value.shopCategory==='string'){
    row.shopCategory=normalize(parts[0],value.shopCategory);
    if(row.shopCategory===pending){const legacy=value.legacyShopCategory||value.shopCategory;if(legacy!==pending&&legacy!=='待确认')row.legacyShopCategory=String(legacy)}
   }
   if(typeof value.assessed==='boolean')row.assessed=value.assessed;
   if(Object.keys(row).length)shops[key]=row;
  }
  return {version:1,shops};
 }
 const valid=(platform,category)=>allowed(platform).includes(category);
 const rank=category=>{const index=order.indexOf(category);return index<0?order.length:index};
 return {name,allowed,options,normalize,infer,resolve,store,valid,rank,pending};
})();

// 与随附目标管理共用目标存储；产品和链接全部历史归属分别去重汇总，保留多人多品牌。
const ShopAttribution=(()=>{
 const key='goal-prototype-targets-v1',fields=['brand','region','strategy','promotion'];
 const channel=new BroadcastChannel('compass-shop-targets');let listeners=new Set();
 const unique=values=>[...new Set(values.filter(Boolean).map(String))];
 function read(date){
  let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'null')||{}}catch(_){return {error:'目标数据读取失败，请刷新后重试',rows:new Map()}}
  const rows=new Map();
  for(const kind of ['product','link']){
   const records={...shopGoalSeed[kind],...(saved[kind]||{})};
   for(const value of Object.values(records)){
    if(!value)continue;
    const master=shopGoalSeed.shops.find(shop=>shop.shopId===value.shopId);if(!master)continue;
    const identity=master.channel+'|'+master.shopId;
    const row=rows.get(identity)||Object.fromEntries(fields.map(field=>[field,[]]));
    for(const field of fields){const id=value[field+'Id'],person=['strategy','promotion'].includes(field)?shopGoalSeed.people.find(p=>p.id===id||p.id===value[field]):null;row[field].push(person?.name||value[field]||'')}
    rows.set(identity,row);
   }
  }
  for(const row of rows.values())for(const field of fields)row[field]=unique(row[field]);
  return {rows,period:'全部历史',revision:saved.revision||0};
 }
 function notify(){for(const fn of listeners)fn()}
 channel.onmessage=event=>{
  if(event.data?.type!=='targets'||!event.data.state?.product||!event.data.state?.link)return;
  try{const current=JSON.parse(localStorage.getItem(key)||'null');if((event.data.state?.revision||0)>=(current?.revision||0)){localStorage.setItem(key,JSON.stringify(event.data.state));notify()}}catch(_){notify()}
 };
 channel.postMessage({type:'request'});
 window.addEventListener('storage',e=>{if(e.key===key)notify()});window.addEventListener('focus',notify);
 return {read,subscribe(fn){listeners.add(fn)}};
})();

// 分类/考核独立于负责计划和目标归属，跨平台使用平台＋店铺ID隔离。
const ShopSettings=(()=>{
 const rules=window.ShopClassification,key='shop-classification-config-v1';
 const platformNames={douyin:'抖音',kuaishou:'快手',wechat:'视频号',tmall:'天猫',jd:'京东',pdd:'拼多多'};
 const bus=new BroadcastChannel('compass-shop-metadata');
 const identity=shop=>platformNames[platformId]+'|'+shop.id;
 function load(){const data=JSON.parse(localStorage.getItem(key)||'null');return rules.store(data)}
 function value(shop){
  let saved;try{saved=load().shops[identity(shop)]}catch(_){}
  const original=dashboardShopSeed.find(s=>s.channel===platformNames[platformId]&&s.shopId===shop.id);
  return rules.resolve(platformId,original||{name:shop.name,assessed:false},saved);
 }
 function save(shop,patch){
  try{const data=load(),next={...value(shop),...patch};if(Object.hasOwn(patch,'shopCategory')&&!rules.valid(platformId,patch.shopCategory)||typeof next.assessed!=='boolean')throw Error();
   if(next.shopCategory!==rules.pending)delete next.legacyShopCategory;
   data.shops[identity(shop)]=next;localStorage.setItem(key,JSON.stringify(data));bus.postMessage({type:'metadata',store:data});return true;
  }catch(_){return false}
 }
 function cells(shop){const data=value(shop),esc=View.escape;return `<td><select data-shop-category="${esc(shop.id)}" aria-label="店铺分类：${esc(shop.name)}">${(data.shopCategory===rules.pending?'<option value="" selected disabled>无分类</option>':'')+rules.allowed(platformId).map(name=>`<option ${name===data.shopCategory?'selected':''}>${name}</option>`).join('')}</select></td><td><button type="button" role="switch" class="ss-switch" aria-checked="${data.assessed}" aria-label="是否考核：${esc(shop.name)}" data-shop-assessed="${esc(shop.id)}"><i></i></button><span class="ss-switch-label">${data.assessed?'是':'否'}</span></td>`}
 function matches(shop,root){const data=value(shop),category=root.querySelector('#category-filter').value,assessed=root.querySelector('#assessed-filter').value;return (!category||data.shopCategory===category)&&(!assessed||data.assessed===(assessed==='yes'))}
 function extendSeed(original,name){return [...original,...dashboardShopSeed.filter(shop=>shop.channel===name&&!original.some(s=>s.id===shop.shopId)).map(shop=>({id:shop.shopId,name:shop.name,brand:shop.brand,configs:[],updatedAt:null}))]}
 function date(){return new URLSearchParams(location.search).get('date')||new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(new Date())}
 function derived(shop){return ShopAttribution.read(date()).rows.get(identity(shop))||{brand:[],region:[],strategy:[],promotion:[]}}
 function renderReadOnly(root,shops,pagination,notice){
  const $=selector=>root.querySelector(selector),esc=View.escape,source=ShopAttribution.read(date());
  const all=shops.map(shop=>({...shop,attribution:source.rows.get(identity(shop))||{brand:[],region:[],strategy:[],promotion:[]}}));
  for(const [selector,field] of [['#brand-filter','brand'],['#region-filter','region']]){
   const control=$(selector),selected=control.value,values=[...new Set(all.flatMap(s=>s.attribution[field]))];if(selected&&!values.includes(selected))values.push(selected);
   control.innerHTML=View.options(values,selected,selector==='#brand-filter'?'请选择品牌':'请选择运营大区');
  }
  const query=$('#shop-search').value.trim().toLowerCase(),brand=$('#brand-filter').value,region=$('#region-filter').value,strategy=$('#owner-filter').value.trim(),promotion=$('#promotion-filter').value.trim();
  const rows=all.filter(shop=>matches(shop,root)&&(!query||[shop.name,shop.id].some(s=>s.toLowerCase().includes(query)))&&(!brand||shop.attribution.brand.includes(brand))&&(!region||shop.attribution.region.includes(region))&&(!strategy||shop.attribution.strategy.some(s=>s.includes(strategy)))&&(!promotion||shop.attribution.promotion.some(s=>s.includes(promotion))));
  const field=(shop,key)=>`<td class="ss-readonly" title="${esc(source.period+'目标：'+(shop.attribution[key].join('、')||'未配置'))}">${shop.attribution[key].map(esc).join('<br>')||'<span class="ss-empty">未配置</span>'}</td>`;
  $('.shop-table thead').innerHTML='<tr><th>店铺名称</th><th>品牌</th><th>运营大区</th><th>店铺策略</th><th>店铺推广</th><th>店铺分类</th><th>是否考核店铺</th></tr>';
  $('#shop-rows').innerHTML=pagination.slice(rows).map(shop=>`<tr data-shop="${esc(shop.id)}"><td><div class="shop-name">${esc(shop.name)}</div><div class="shop-id">ID：${esc(shop.id)}</div></td>${['brand','region','strategy','promotion'].map(key=>field(shop,key)).join('')}${cells(shop)}</tr>`).join('')||'<tr><td colspan="7" class="empty">没有匹配的店铺</td></tr>';
  if(source.error)notice(source.error,'error');
 }
 function bind(root,{getShops,refresh,notice}){
  root.classList.toggle('ss-readonly-platform',!!activePlatform.readOnly);
  root.querySelector('#category-filter').innerHTML='<option value="">全部分类</option>'+rules.options(platformId).map(s=>'<option>'+s+'</option>').join('');
  root.addEventListener('change',event=>{const select=event.target.closest('[data-shop-category]');if(!select)return;const shop=getShops().find(s=>s.id===select.dataset.shopCategory);if(shop&&!save(shop,{shopCategory:select.value}))notice('保存失败，请稍后重试','error');refresh();root.querySelector('[data-shop-category="'+CSS.escape(shop.id)+'"]')?.focus({preventScroll:true})});
  root.addEventListener('click',event=>{const button=event.target.closest('[data-shop-assessed]');if(!button)return;const shop=getShops().find(s=>s.id===button.dataset.shopAssessed);if(shop&&!save(shop,{assessed:!value(shop).assessed}))notice('保存失败，请稍后重试','error');refresh();root.querySelector('[data-shop-assessed="'+CSS.escape(shop.id)+'"]')?.focus({preventScroll:true})});
  window.addEventListener('storage',event=>{if(event.key===key)refresh()});ShopAttribution.subscribe(refresh);
  bus.onmessage=event=>{if(event.data?.type==='metadata'){try{localStorage.setItem(key,JSON.stringify(rules.store(event.data.store)));refresh()}catch(_){notice('配置同步失败，请刷新重试','error')}}};
  window.shopAdminAudit=()=>({platform:platformId,readonly:!!activePlatform.readOnly,shops:getShops().map(shop=>({...shop,metadata:value(shop),attribution:activePlatform.readOnly?derived(shop):null}))});
 }
 return {cells,matches,extendSeed,renderReadOnly,bind};
})();

/* List pagination is applied after filtering and sorting. */
function createPagination(root, onChange, {prefix = '',countId = 'total-count'} = {}) {
  const $ = selector => root.querySelector(selector.replace(/^#page-/,`#${prefix}page-`).replace(/^#total-count$/,`#${countId}`));
  let page = 1, size = 10, total = 0;
  const pages = () => Math.max(1,Math.ceil(total / size));
  function go(value) {
    const next = Number(value);
    if (!Number.isInteger(next)) { $('#page-jump').value = page; return; }
    page = Math.min(pages(),Math.max(1,next)); onChange();
  }
  $('#page-prev').addEventListener('click',() => go(page-1));
  $('#page-next').addEventListener('click',() => go(page+1));
  $('#page-numbers').addEventListener('click',event => {
    const button = event.target.closest('[data-page]');
    if (!button) return;
    const number = button.dataset.page; go(number);
    $(`[data-page="${number}"]`)?.focus({preventScroll:true});
  });
  $('#page-size').addEventListener('change',event => { size = Number(event.target.value); page = 1; onChange(); });
  $('#page-jump').addEventListener('change',event => go(event.target.value));
  $('#page-jump').addEventListener('keydown',event => {
    if (event.key === 'Enter') { event.preventDefault(); go(event.target.value); }
  });
  function slice(rows) {
    total = rows.length; page = Math.min(page,pages());
    $('#total-count').textContent = `共 ${total} 条`;
    $('#page-prev').disabled = page === 1; $('#page-next').disabled = page === pages();
    $('#page-jump').max = pages(); $('#page-jump').value = page; $('#page-jump').disabled = !total;
    $('#page-numbers').innerHTML = Array.from({length:pages()},(_,index) => {
      const number = index+1;
      return `<button type="button" data-page="${number}" aria-label="第 ${number} 页"${number === page ? ' aria-current="page"' : ''}>${number}</button>`;
    }).join('');
    return rows.slice((page-1)*size,page*size);
  }
  return {slice,reset:() => {page = 1;}};
}

// Shared clearing behavior for native business selects and searchable person pickers.
function createClearableSelects(root) {
  const selector = 'select:not(.shop-pagination select):not([data-shop-category]), input[role="combobox"]';
  const controls = new WeakMap();
  function refresh() {
    root.querySelectorAll(selector).forEach(input => {
      let button = controls.get(input);
      if (!button) {
        const wrapper = input.closest('.person-picker') || document.createElement('span');
        if (!wrapper.classList.contains('person-picker')) {
          wrapper.className = 'clearable-select'; input.before(wrapper); wrapper.append(input);
        }
        button = document.createElement('button');
        button.type = 'button'; button.className = 'selection-clear'; button.textContent = '×';
        const label = input.closest('label')?.cloneNode(true);
        label?.querySelectorAll('select,input,button,.person-picker,.clearable-select').forEach(el => el.remove());
        const name = input.getAttribute('aria-label') || label?.textContent.replace(/\*/g,'').trim() || '选择';
        button.setAttribute('aria-label',`清空${name}`); button.title = '清空';
        button.addEventListener('click',event => {
          event.preventDefault(); event.stopPropagation();
          input.value = '';
          input.dispatchEvent(new Event('input',{bubbles:true}));
          input.dispatchEvent(new Event('change',{bubbles:true}));
          refresh(); input.focus({preventScroll:true});
        });
        wrapper.append(button); controls.set(input,button);
      }
      const filled = !!input.value && !input.disabled;
      button.hidden = !filled;
      input.parentElement.classList.toggle('has-selection',filled);
    });
  }
  root.addEventListener('input',refresh);
  root.addEventListener('change',refresh);
  // Dynamic form rows and programmatic option/person updates use the same control.
  new MutationObserver(refresh).observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['data-selected','disabled']});
  refresh();
}

  function commit(nextShops) {
    try {
      const merged = mergeShopChanges(shops,nextShops,JSON.parse(localStorage.getItem(key)));
      localStorage.setItem(key,JSON.stringify({shops:merged})); shops = merged; return true;
    } catch (error) {
      notice(error.message === 'SHOP_CONFLICT' ? '该店铺配置已更新，请刷新后核对再保存。' : '保存失败，请稍后重试。','error'); return false;
    }
  }
  function syncModal() {
    const confirming = !$('#confirm-overlay').hidden, editing = !$('#editor-overlay').hidden, recording = !$('#records-overlay').hidden, creating = !$('#new-config-overlay').hidden;
    $('.product-shell').inert = confirming || editing || recording || creating;
    $('#editor-overlay').inert = confirming || recording || creating;
    $('#new-config-overlay').inert = confirming;
    $('#records-overlay').inert = confirming;
    document.body.style.overflow = confirming || editing || recording || creating ? 'hidden' : '';
  }
  function ask(title,copy,action,yes = '确认',no = '返回') {
    $('#confirm-no').textContent = no;
    confirmReturn = document.activeElement; confirmAction = action;
    $('#confirm-title').textContent = title; $('#confirm-copy').textContent = copy; $('#confirm-yes').textContent = yes;
    $('#confirm-overlay').hidden = false; syncModal(); $('#confirm-no').focus();
  }
  function dismissConfirm() {
    $('#confirm-overlay').hidden = true; confirmAction = null; syncModal();
    if (confirmReturn?.isConnected) confirmReturn.focus();
  }
  const pagination = createPagination(root,renderList);
  function renderList() {
    if(activePlatform.readOnly)return ShopSettings.renderReadOnly(root,shops,pagination,notice);
    const query = $('#shop-search').value.trim().toLowerCase(), brand = $('#brand-filter').value, region = $('#region-filter').value, owner = $('#owner-filter').value.trim();
    ['#brand-filter','#region-filter'].forEach(s => $(s).classList.toggle('placeholder',!$(s).value));
    $('#modified-sort').dataset.direction = modifiedSort;
    $('#modified-sort').setAttribute('aria-label',`最近修改时间，当前${modifiedSort === 'desc' ? '倒序，点击改为正序' : '正序，点击改为倒序'}`);
    $('#modified-sort').closest('th').setAttribute('aria-sort',modifiedSort === 'desc' ? 'descending' : 'ascending');
    const rows = shops.filter(s => {
      const p = A.resolve(s,today);
      return ShopSettings.matches(s,root) && (!query || s.name.toLowerCase().includes(query) || s.id.includes(query)) && (!brand || s.brand === brand) && (!region || p?.region === region) && (!owner || p?.owner.includes(owner));
    }).sort((a,b) => {
      const left = modifiedTime(a.updatedAt), right = modifiedTime(b.updatedAt);
      if (left === null || right === null) return left === right ? seed.findIndex(s => s.id === a.id) - seed.findIndex(s => s.id === b.id) : left === null ? 1 : -1;
      return (modifiedSort === 'desc' ? right - left : left - right) || a.id.localeCompare(b.id);
    });
    $('#shop-rows').innerHTML = pagination.slice(rows).map(s => {
      const p = A.resolve(s,today), next = A.next(s,today);
      return `<tr data-shop="${s.id}"><td><div class="shop-identity"><span class="brand-mark" data-brand="${V.escape(s.brand)}" aria-hidden="true">${V.escape(s.brand || '店')}</span><div><div class="shop-name">${V.escape(s.name)}</div><div class="shop-id">ID：${s.id}</div></div></div></td><td>${V.escape(s.brand || '--')}</td><td>${V.escape(p?.region || '--')}</td><td><span>${V.escape(p?.owner || '--')}</span>${next ? `<div class="next-person">${V.date(next.date)} 起 → ${V.escape(V.person(next))}</div>` : ''}</td><td class="modified-time">${modifiedTime(s.updatedAt) === null ? '--' : V.dateTime(s.updatedAt)}</td>${ShopSettings.cells(s)}<td><div class="actions"><button class="text-button" data-open="${s.id}">配置</button></div></td></tr>`;
    }).join('') || '<tr><td colspan="8" class="empty"><strong>没有匹配的店铺</strong></td></tr>';
  }
  const form = createConfigurationForm(root,{getToday:() => today,getShop:shop,directory:activePlatform});
  const records = createRecordsView(root,{getShops:() => shops,directory:activePlatform});
  const getBrands = () => [...new Set([...brandOptions,...shops.map(s => s.brand)].filter(Boolean))];
  function refreshBrandFilter() {
    const value = $('#brand-filter').value;
    $('#brand-filter').innerHTML = V.options(getBrands(),value,'请选择品牌');
  }
  const brandEditor = createBrandEditor(root,{getShop:shop,getBrands,onSave:value => {
    if(activePlatform.readOnly)return false;
    const next = structuredClone(shops), target = next.find(s => s.id === selected);
    target.brand = value; target.updatedAt = new Date().toISOString();
    if (!commit(next)) return false;
    refreshBrandFilter(); pagination.reset(); renderList();
    notice('品牌已保存，立即生效'); return true;
  }});
  function renderContext() {
    $('#current-context-person').textContent = A.resolve(shop(),today) ? V.person(A.resolve(shop(),today)) : '--';
    renderConfigurationList(root,shop(),today);
  }
  function showConfigurations() {
    form.closeTransient(); renderContext();
    $('#configuration-list').hidden = false;
    $('#config-form').hidden = true; $('#save-config').hidden = true;
    $('#cancel-form').textContent = '关闭'; $('#editor-title').textContent = '店铺负责配置';
    $('#new-config').focus({preventScroll:true});
  }
  let editingConfigId = null;
  function showConfiguration(config = null) {
    if (config && config.start <= today) return;
    editingConfigId = config?.id || null;
    showConfigurations(); form.load(config);
    $('#new-config-title').textContent = config ? '编辑配置' : '新增配置';
    $('#new-config-overlay [data-close-new]').setAttribute('aria-label',config ? '关闭编辑配置' : '关闭新增配置');
    $('#new-config-shop').textContent = `${shop().name}（${shop().id}）`;
    $('#new-config-content').append($('#config-form'));
    $('#new-config-dialog').append($('#editor-actions'));
    $('#config-form').hidden = false; $('#save-config').hidden = false;
    $('#cancel-form').textContent = '取消'; $('#new-config-overlay').hidden = false;
    $('#new-config-content').scrollTop = 0; syncModal(); $('#new-config-dialog').focus({preventScroll:true});
  }

  function openEditor(id) {
    clearTimeout(toastTimer); $('#toast').hidden = true;
    selected = id; editorReturn = document.activeElement;
    $('#configuration-history').open = false;
    $('#editor-shop').textContent = shop().name; brandEditor.reset();
    showConfigurations(); $('#editor-overlay').hidden = false; syncModal(); $('#editor-overlay .close').focus();
  }
  function leaveForm(action) {
    if (brandEditor.dirty()) {
      ask('放弃品牌修改？','尚未保存的品牌修改将丢失。',() => {brandEditor.reset(); action();},'放弃修改');
      return;
    }
    brandEditor.reset();
    if (!$('#config-form').hidden && form.dirty()) ask('放弃本次修改？','尚未保存的内容将丢失，已保存的配置不受影响。',action,'放弃修改');
    else action();
  }
  function closeEditor() {
    leaveForm(finishEditor);
  }
  function finishConfigurationModal() {
    form.closeTransient(); $('#new-config-overlay').hidden = true;
    $('#editor-overlay .dialog-content').append($('#config-form'));
    $('#editor-overlay .editor').append($('#editor-actions'));
    showConfigurations(); syncModal();
    const target = editingConfigId ? [...root.querySelectorAll('[data-config]')].find(button => button.dataset.config === editingConfigId) : null;
    (target || $('#new-config')).focus({preventScroll:true});
    editingConfigId = null;
  }
  function closeConfigurationModal() { leaveForm(finishConfigurationModal); }
  function finishForm() {
    if (!$('#new-config-overlay').hidden) finishConfigurationModal();
    else finishEditor();
  }
  function finishEditor() {
    form.closeTransient(); $('#editor-overlay').hidden = true; syncModal();
    // A list refresh replaces row buttons, so restore focus to the new matching control.
    const target = editorReturn?.isConnected ? editorReturn : $(`[data-open="${selected}"]`);
    (target || $('#shop-search')).focus({preventScroll:true});
  }
  function openRecords(id = null,fromEditor = false) {
    recordReturn = document.activeElement; recordsFromEditor = fromEditor;
    if (fromEditor) { form.closeTransient(); $('#editor-overlay').hidden = true; }
    records.open(id); $('#records-overlay').hidden = false; syncModal(); $('#records-overlay .close').focus();
  }
  function closeRecords() {
    $('#records-overlay').hidden = true;
    if (recordsFromEditor) $('#editor-overlay').hidden = false;
    syncModal(); if (recordReturn?.isConnected) recordReturn.focus();
  }
  function cancelConfig(id) {
    const c = shop().configs.find(c => c.id === id); if (!c || c.start <= today) return;
    ask('确认取消配置？','取消后无法恢复，请谨慎操作。',() => {
      if (!override) today = localDate();
      if (c.start <= today) { notice('该配置已生效，无法取消，请刷新后查看。','error'); return; }
      const next = structuredClone(shops), target = next.find(s => s.id === selected);
      target.configs = target.configs.filter(p => p.id !== id || p.start <= today);
      target.updatedAt = new Date().toISOString();
      ConfigurationHistory.append(target,{action:'cancel',before:c,after:null,changedBy:currentOperator,changedAt:target.updatedAt});
      if (commit(next)) { pagination.reset(); renderList(); showConfigurations(); notice('已取消待生效配置'); }
    },'确认取消','暂不取消');
  }
  root.addEventListener('click',event => {
    // Only the backdrop itself dismisses a drawer; clicks inside it must not bubble into dismissal.
    if (event.target === $('#editor-overlay')) return closeEditor();
    if (event.target === $('#records-overlay')) return closeRecords();
    if (event.target === $('#new-config-overlay')) return closeConfigurationModal();
    const button = event.target.closest('button'); if (!button) return;
    if(button.id==='shop-filter-reset'){for(const input of root.querySelectorAll('.filters input,.filters select'))input.value='';pagination.reset();renderList();return}
    if (button.hasAttribute('data-close')) return button.closest('#records-overlay') ? closeRecords() : closeEditor();
    if (button.hasAttribute('data-close-new')) return closeConfigurationModal();
    if (button.dataset.open&&!activePlatform.readOnly) openEditor(button.dataset.open);
    if (button.dataset.config) leaveForm(() => showConfiguration(shop().configs.find(c => c.id === button.dataset.config)));
    if (button.id === 'new-config') leaveForm(() => showConfiguration());
    if (button.dataset.cancelConfig) cancelConfig(button.dataset.cancelConfig);
    if (button.id === 'cancel-form') { if (!$('#new-config-overlay').hidden) closeConfigurationModal(); else closeEditor(); }
    if (button.id === 'records-open') openRecords();
    if (button.id === 'shop-records') leaveForm(() => openRecords(selected,true));
    if (button.id === 'confirm-no') dismissConfirm();
    if (button.id === 'confirm-yes') { const action = confirmAction; dismissConfirm(); action?.(); }
    if (button.id === 'modified-sort') { modifiedSort = modifiedSort === 'desc' ? 'asc' : 'desc'; pagination.reset(); renderList(); }
  });
  $('#config-form').addEventListener('submit',event => {
    event.preventDefault();
    if (activePlatform.readOnly || $('#editor-overlay').hidden || $('#config-form').hidden) return;
    if (!override) today = localDate();
    if (!form.dirty() && shop().configs.length) { finishForm(); return; }
    const c = form.draft(), error = form.validate(c);
    if (error) { $('#form-error').textContent = error; $('#form-error').hidden = false; $('#form-error').scrollIntoView({block:'nearest'}); return; }
    const next = structuredClone(shops), target = next.find(s => s.id === selected);
    const action = c.id ? 'update' : 'create';
    const before = c.id ? target.configs.find(p => p.id === c.id) : null;
    c.changedBy = currentOperator; c.changedAt = new Date().toISOString();
    if (c.id) target.configs = target.configs.map(p => p.id === c.id ? c : p);
    else { c.id = `config-${crypto.randomUUID()}`; target.configs.push(c); }
    target.updatedAt = c.changedAt;
    ConfigurationHistory.append(target,{action,before,after:c,changedBy:currentOperator,changedAt:c.changedAt});
    A.syncSnapshots(target,today);
    if (commit(next)) { pagination.reset(); renderList(); finishForm(); notice(c.start === today ? '已保存，今日生效' : `已保存，将于 ${V.date(c.start)} 自动生效`); }
  });
  refreshBrandFilter();
  $('#region-filter').innerHTML = V.options(regions,'',activePlatform.placeholder);
  ['#shop-search','#brand-filter','#region-filter','#owner-filter','#promotion-filter','#category-filter','#assessed-filter'].forEach(s => $(s).addEventListener('input',() => { pagination.reset(); renderList(); }));
  root.addEventListener('keydown',event => {
    const modal = !$('#confirm-overlay').hidden ? $('#confirm-overlay') : !$('#new-config-overlay').hidden ? $('#new-config-overlay') : !$('#records-overlay').hidden ? $('#records-overlay') : !$('#editor-overlay').hidden ? $('#editor-overlay') : null;
    if (!modal) return;
    if (event.key === 'Escape') { event.preventDefault(); if (modal.id === 'confirm-overlay') dismissConfirm(); else if (modal.id === 'new-config-overlay') closeConfigurationModal(); else if (modal.id === 'records-overlay') closeRecords(); else closeEditor(); }
    if (event.key === 'Tab') {
      const controls = [...modal.querySelectorAll('button,input,select,summary')].filter(el => !el.disabled && el.getClientRects().length);
      const first = controls[0], last = controls.at(-1);
      if (!controls.includes(document.activeElement)) { event.preventDefault(); (event.shiftKey ? last : first)?.focus(); }
      else if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });
  // Reconcile missed transitions on load and when a live page crosses midnight.
  setInterval(() => {
    if (override || today === localDate()) return;
    today = localDate(); const next = structuredClone(shops); next.forEach(s => A.syncSnapshots(s,today));
    if (!commit(next)) shops = next;
    renderList(); if (!$('#editor-overlay').hidden) renderContext();
    if (!$('#records-overlay').hidden) records.render();
  },30000);
  ShopSettings.bind(root,{getShops:()=>shops,refresh:()=>{pagination.reset();renderList()},notice});
  if(activePlatform.readOnly){$('#owner-filter-label').textContent='店铺策略';$('#owner-filter').placeholder='请输入策略姓名'}
  createClearableSelects(root);
  renderList();
})();
</script></body>
</html>
